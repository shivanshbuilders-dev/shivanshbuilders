[build]
  publish = "website"

# Netlify custom 404 rule with real HTTP 404 status
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Production security and asset headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Ensure Service Worker is never aggressively cached and allowed at root scope
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"
